name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Run tests
        run: php tests/run.php

      - name: Run client tests
        run: node tests/client-expand.js

      - name: Build release ZIP
        run: |
          stage_parent="$(mktemp -d)"
          stage="$stage_parent/anchor-private-file-manager"
          mkdir -p "$stage"

          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.superpowers' \
                   --exclude='.DS_Store' \
                   --exclude='docs' \
                   --exclude='tests' \
                   --exclude='.env' \
                   --exclude='*.md' \
                   ./ "$stage/"

          (cd "$stage_parent" && zip -rq "$GITHUB_WORKSPACE/anchor-private-file-manager.zip" "anchor-private-file-manager")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: anchor-private-file-manager.zip
